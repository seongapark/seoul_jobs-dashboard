name: 월간 수집

# 매월 5일 10:00 KST(=UTC+9, 01:00 UTC)에 EIS 유효구인구직/취업/피보험/경력이동과
# 24개월 시계열을 받는다. 다섯 개 페이지네이션 데이터셋 × 12~15분이라 잡 하나가
# 1시간 안팎 걸린다 — 기본 360분 안에는 들지만, 그 여유를 명시해 둔다.
on:
  schedule:
    - cron: "0 1 5 * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      - run: python -m pipeline.cli monthly
      - run: python -m pipeline.cli series

      # 커밋 단계는 위 두 수집이 다 성공했을 때만 돈다 — GitHub Actions 기본
      # 동작이 "이전 스텝이 실패하면 이후 스텝을 건너뛴다"이므로 별도 조건
      # (if: always() 등)을 붙이지 않는다. 이 파이프라인의 존재 이유("틀린
      # 값이면 배포되지 않는다")가 여기 걸려 있다 — 절반만 갱신된 채로
      # 커밋되면 안 된다.
      #
      # git add 는 이름을 하나하나 적는다(git add -A/. 금지) — 워크플로가
      # 만든 적 없는 파일을 실수로 함께 커밋하는 것을 막는다. 목록은
      # pipeline/fetchers.py 의 MONTHLY_SPECS/SERIES_SPECS 이름 그대로다.
      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vacancy.json data/vacancy_industry.json data/vacancy_sido.json \
                  data/placement.json data/placement_sido.json \
                  data/insured.json data/insured_industry.json data/insured_sido.json \
                  data/mobility.json data/vacancy_series.json data/insured_series.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "data: 월간 자동 수집 $(date -u +%Y-%m-%d)"
            git push
          fi
