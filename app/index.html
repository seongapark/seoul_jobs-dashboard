<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#23508f">
  <title>수도권 구인구직</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="./core/tokens.css">
  <link rel="stylesheet" href="./core/base.css">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <a class="header__home" href="../" aria-label="홈으로">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
      </a>
      <div class="header__title">구인구직</div>
      <div class="header__meta"><span class="num" id="headerDate"></span></div>
    </header>
    <nav class="segments" id="segments" role="tablist">
      <a class="segment" href="#/" data-route="overview" role="tab">총괄</a>
      <a class="segment" href="#/occupation" data-route="occupation" role="tab">직종별</a>
      <a class="segment" href="#/industry" data-route="industry" role="tab">산업별</a>
      <a class="segment" href="#/center" data-route="center" role="tab">센터별</a>
    </nav>
    <div id="staleBanner" class="offline-banner" hidden></div>
    <main id="screen" class="screen"></main>
    <div class="notice">본 자료는 서울고용센터 분석지원 산출물이며, 각 기관 원문이 정본입니다.</div>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
